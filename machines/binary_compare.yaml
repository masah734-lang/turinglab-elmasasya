#  en soldan başlayarak bitleri karşılatırmaya başlar. Eğer bitler farklı ise,
#  daha büyük olan bitin hangi tarafta olduğunu belirler ve sonucu ona göre verir. 
#  Eğer tüm bitler aynı ise, sonuç eşit olur.

name: "binary_compare"

description: "İki eşit uzunluklu binary sayıyı karşılaştırır"

states:
  - q0
  - q_left_0
  - q_left_1
  - q_find_right_0
  - q_find_right_1
  - q_back
  - q_accept
  - q_reject

input_alphabet:
  - "0"
  - "1"
  - "#"

tape_alphabet:
  - "0"
  - "1"
  - "#"
  - "X"
  - "B"

blank: "B"

start_state: q0

accept_states:
  - q_accept

reject_states:
  - q_reject

transitions:

  # Solda ilk işaretlenmemiş biti bul

  - {state: q0, read: "X", next: q0, write: "X", move: R}

  - {state: q0, read: "0", next: q_left_0, write: "X", move: R}

  - {state: q0, read: "1", next: q_left_1, write: "X", move: R}

  # Eğer # gördüysek tüm bitler eşitti

  - {state: q0, read: "#", next: q_reject, write: "#", move: S}

  # Sağ tarafa git

  - {state: q_left_0, read: "0", next: q_left_0, write: "0", move: R}

  - {state: q_left_0, read: "1", next: q_left_0, write: "1", move: R}

  - {state: q_left_0, read: "#", next: q_find_right_0, write: "#", move: R}

  - {state: q_left_1, read: "0", next: q_left_1, write: "0", move: R}

  - {state: q_left_1, read: "1", next: q_left_1, write: "1", move: R}

  - {state: q_left_1, read: "#", next: q_find_right_1, write: "#", move: R}

  # Karşılaştır

  # Sol 0 sağ 1 → reject

  - {state: q_find_right_0, read: "1", next: q_reject, write: "1", move: S}

  # Sol 1 sağ 0 → accept

  - {state: q_find_right_1, read: "0", next: q_accept, write: "0", move: S}

  # Eşitse işaretle geri dön

  - {state: q_find_right_0, read: "0", next: q_back, write: "X", move: L}

  - {state: q_find_right_1, read: "1", next: q_back, write: "X", move: L}

  # Geri dön

  - {state: q_back, read: "0", next: q_back, write: "0", move: L}

  - {state: q_back, read: "1", next: q_back, write: "1", move: L}

  - {state: q_back, read: "X", next: q_back, write: "X", move: L}

  - {state: q_back, read: "#", next: q_back, write: "#", move: L}

  - {state: q_back, read: "B", next: q0, write: "B", move: R}